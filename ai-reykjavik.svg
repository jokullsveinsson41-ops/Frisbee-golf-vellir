<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#071019"/>
    <stop offset=".48" stop-color="#10252c"/>
    <stop offset="1" stop-color="#08110f"/>
  </linearGradient>
  <linearGradient id="cityGlow" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#79f5ff" stop-opacity=".12"/>
    <stop offset=".5" stop-color="#d8ff9f" stop-opacity=".18"/>
    <stop offset="1" stop-color="#79f5ff" stop-opacity=".08"/>
  </linearGradient>
  <radialGradient id="aurora">
    <stop stop-color="#79f5ff" stop-opacity=".46"/>
    <stop offset=".45" stop-color="#8dffbd" stop-opacity=".22"/>
    <stop offset="1" stop-color="#79f5ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#183a3f"/>
    <stop offset="1" stop-color="#0e1718"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="noise"><feTurbulence baseFrequency=".78" numOctaves="3" seed="21"/><feComponentTransfer><feFuncA type="table" tableValues="0 .065"/></feComponentTransfer></filter>
</defs>

<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="410" cy="170" rx="520" ry="210" fill="url(#aurora)" filter="url(#blur)"/>
<path d="M0 290 C260 210 470 255 720 180 C960 112 1220 150 1600 90" fill="none" stroke="#77f4ff" stroke-opacity=".11" stroke-width="34"/>
<path d="M0 350 C270 275 510 315 760 245 C1030 170 1290 205 1600 150" fill="none" stroke="#a8ffb8" stroke-opacity=".08" stroke-width="25"/>

<!-- distant Esja / mountain silhouette -->
<path d="M0 520 L180 430 320 500 480 390 640 500 830 410 1010 500 1180 380 1360 470 1600 360 1600 610 0 610Z" fill="#0a1315"/>

<!-- city horizon -->
<rect x="0" y="560" width="1600" height="230" fill="url(#cityGlow)" opacity=".36"/>
<g fill="#12272b">
  <rect x="40" y="600" width="120" height="165"/>
  <rect x="175" y="575" width="150" height="190"/>
  <rect x="338" y="620" width="102" height="145"/>
  <rect x="455" y="545" width="190" height="220"/>
  <rect x="660" y="595" width="130" height="170"/>
  <rect x="805" y="525" width="210" height="240"/>
  <rect x="1030" y="590" width="145" height="175"/>
  <rect x="1190" y="555" width="180" height="210"/>
  <rect x="1384" y="605" width="165" height="160"/>
</g>

<!-- Reykjavik-inspired church silhouette -->
<g fill="#1c353a">
  <rect x="720" y="450" width="62" height="315"/>
  <path d="M751 340 L716 455 H786 Z"/>
  <rect x="675" y="540" width="35" height="225"/>
  <rect x="792" y="540" width="35" height="225"/>
  <rect x="642" y="600" width="27" height="165"/>
  <rect x="833" y="600" width="27" height="165"/>
</g>

<!-- lit windows -->
<g fill="#d8ff9f" opacity=".40">
  <rect x="82" y="635" width="13" height="13"/><rect x="115" y="670" width="13" height="13"/>
  <rect x="215" y="620" width="15" height="15"/><rect x="270" y="650" width="15" height="15"/>
  <rect x="500" y="590" width="15" height="15"/><rect x="560" y="630" width="15" height="15"/>
  <rect x="850" y="580" width="14" height="14"/><rect x="930" y="620" width="14" height="14"/>
  <rect x="1240" y="600" width="15" height="15"/><rect x="1305" y="640" width="15" height="15"/>
  <rect x="1440" y="650" width="13" height="13"/>
</g>
<g fill="#79f5ff" opacity=".34">
  <rect x="310" y="655" width="11" height="11"/><rect x="1045" y="625" width="12" height="12"/><rect x="1350" y="610" width="11" height="11"/>
</g>

<!-- urban road / plaza perspective -->
<path d="M0 1000 L420 770 H1180 L1600 1000Z" fill="url(#road)"/>
<path d="M800 785 L760 1000" stroke="#79f5ff" stroke-opacity=".15" stroke-width="2"/>
<path d="M890 785 L1035 1000" stroke="#d8ff9f" stroke-opacity=".13" stroke-width="2"/>
<path d="M620 820 L1210 820" stroke="#ffffff" stroke-opacity=".055"/>
<path d="M515 875 L1320 875" stroke="#ffffff" stroke-opacity=".04"/>

<!-- disc golf basket in an urban plaza -->
<g transform="translate(1120 610)">
  <circle cx="8" cy="95" r="112" fill="none" stroke="#79f5ff" stroke-opacity=".10" stroke-width="2"/>
  <rect x="0" y="0" width="17" height="230" rx="9" fill="#ddffb7"/>
  <rect x="-78" y="52" width="174" height="12" rx="6" fill="#ddffb7"/>
  <path d="M-58 64 L-39 150 M-34 64 L-18 150 M-9 64 L0 150 M15 64 L18 150 M40 64 L37 150 M64 64 L55 150" stroke="#ddffb7" stroke-width="5"/>
  <rect x="-45" y="149" width="108" height="12" rx="6" fill="#ddffb7"/>
</g>

<!-- subtle flying disc animation: elegant throw into the basket -->
<g aria-hidden="true">
  <path d="M260 500 C500 385 760 410 955 548 C1040 608 1095 655 1128 682 C1132 698 1130 716 1128 735"
        fill="none" stroke="#79f5ff" stroke-width="2.2" stroke-linecap="round"
        stroke-dasharray="3 12" opacity=".08">
    <animate attributeName="opacity" values="0;.10;.16;.05;0;0"
             keyTimes="0;.05;.30;.48;.58;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="28;0;-24"
             dur="2.9s" repeatCount="indefinite"/>
  </path>

  <g>
    <ellipse cx="0" cy="0" rx="25" ry="7.5"
             fill="#d8ff9f" fill-opacity=".12"
             stroke="#efffd7" stroke-width="2"/>
    <path d="M-18 -1 C-8 -6 11 -7 20 -2"
          fill="none" stroke="#79f5ff" stroke-opacity=".72" stroke-width="1.4"/>
    <ellipse cx="-18" cy="1" rx="19" ry="4.5"
             fill="#79f5ff" fill-opacity=".10"/>
    <animateMotion
      path="M260 500 C500 385 760 410 955 548 C1040 608 1095 655 1128 682 C1132 698 1130 716 1128 735"
      dur="6s" repeatCount="indefinite"
      keyTimes="0;.48;1" keyPoints="0;1;1" calcMode="linear"/>
    <animate attributeName="opacity"
      values="0;.92;.92;.82;0;0"
      keyTimes="0;.045;.39;.475;.515;1"
      dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- soft basket response when the disc arrives -->
  <ellipse cx="1128" cy="735" rx="34" ry="14"
           fill="none" stroke="#d8ff9f" stroke-width="2" opacity="0">
    <animate attributeName="rx" values="18;18;42;54;54"
             keyTimes="0;.465;.505;.56;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="7;7;17;21;21"
             keyTimes="0;.465;.505;.56;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;.42;0;0"
             keyTimes="0;.465;.50;.59;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#efffd7" stroke-width="3.5" stroke-linecap="round" opacity="0">
    <path d="M1078 675 L1091 744"/>
    <path d="M1103 672 L1109 750"/>
    <path d="M1128 670 L1128 752"/>
    <path d="M1153 672 L1147 749"/>
    <path d="M1177 676 L1165 744"/>
    <animate attributeName="opacity"
             values="0;0;.58;.18;0;0"
             keyTimes="0;.47;.50;.545;.61;1" dur="6s" repeatCount="indefinite"/>
  </g>
</g>

<!-- light trails -->
<path d="M80 905 C390 840 660 860 1010 810" fill="none" stroke="#79f5ff" stroke-opacity=".15" stroke-width="5"/>
<path d="M170 950 C470 885 720 905 1260 825" fill="none" stroke="#d8ff9f" stroke-opacity=".12" stroke-width="4"/>

<!-- HUD accents -->
<g fill="none" stroke="#79f5ff" stroke-opacity=".15">
  <path d="M96 110 H260"/><path d="M96 110 V180"/>
  <path d="M1504 110 H1340"/><path d="M1504 110 V180"/>
</g>
<circle cx="1390" cy="180" r="48" fill="none" stroke="#d8ff9f" stroke-opacity=".12"/>
<circle cx="1390" cy="180" r="7" fill="#d8ff9f" opacity=".45"/>

<rect width="1600" height="1000" filter="url(#noise)" opacity=".24"/>
</svg>